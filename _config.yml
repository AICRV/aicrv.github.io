title: AI/CRV 2026
preposition: at
description: >-
  The international AI, computer vision, and robotics conference held in Canada  
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://aicrv.github.io/" # the base hostname & protocol for your site, e.g. https://example.com


# theme: jekyll-theme-conference


# Build settings
markdown: kramdown
sass:
  style: compressed

include:
  - _archives
  - index.html

# Additional exclude from processing
exclude:
  - vendor
  - .github/
  - README.md
  - LICENSE.md
  - REDISTRIBUTED.md
  - purgecss.config.js

# Collections and their defaults
collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/
  committee:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room
  - scope:
      path: ""
      type: committee
    values:
      layout: committee


  # ------------------------------------------------------------------
  # Countdown banner toggle
  # Set to true to show the countdown banner on the homepage.
  # Set to false (or remove) to hide it.
  # ------------------------------------------------------------------
show_countdown_banner: true

conference:

  # Language
  lang: en

  # Timezone
  tz: "+02:00"

  # Show theme errors:
  show_errors: True

  # Navigation bar
  navigation:
#    logo:
#      name: Canadian Conference on AI, CV & Robotics
#      # img: ''
#      url: 'https://aicrv.github.io'
    breakpoint: md
    links:
      - name: Attending AI/CRV
        menu:
          - name: Schedule
            relative_url: /#program
          - name: Venue
            relative_url: /#venue
          - name: Speakers
            relative_url: /speakers/
          - name: Campus Map
            absolute_url: "https://roomfinder.sfu.ca/apps/sfuroomfinder_web/"
          - name: Accommodation
            relative_url: /accommodation/
          - name: Venue and Transportation
            relative_url: /venue-transportation/
      - name: Calls for Contributions
        menu:
          - name: Calls for Papers
            relative_url: /calls/papers/
          - name: Calls for Workshops
            relative_url: /calls/workshops/
          - name: Calls for Nectar Track Contributions
            relative_url: /calls/nectar-track/
          - name: Calls for Demos
            relative_url: /calls/demos/
      - name: Program
        menu:
          - name: Overview
            relative_url: /program/
          - name: Canadian AI
            relative_url: /program/ai/
          - name: Conference on Robots & Vision
            relative_url: /program/robots-vision/
          - name: Nectar Track
            relative_url: /program/nectar-track/
          - name: Student Symposium
            relative_url: /program/student-symposium/
          - name: Social Events
            relative_url: /program/social-events/
          - name: Workshops
            relative_url: /program/workshops/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;Responsible AI Track"
            relative_url: /program/workshops/responsible-ai-track/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;Industry Track"
            relative_url: /program/workshops/industry-track/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;Data and Model Protection in Generative AI"
            relative_url: /program/workshops/data-model-protection/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;AI Strategy and Governance in Business"
            relative_url: /program/workshops/ai-strategy-governance/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;AI for Science and Sustainability"
            relative_url: /program/workshops/ai-science-remote-sensing/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;Beyond the Hype: Building AI Strategy for the Future"
            relative_url: /program/workshops/beyond-hype-ai-strategy/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;AI and Biology"
            relative_url: /program/workshops/ai-biology/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;AI Policy Forum"
            relative_url: /program/workshops/ai-policy-forum/
          - name: "&nbsp;&nbsp;&nbsp;&nbsp;AI in Banking and Financial Services"
            relative_url: /program/workshops/ai-in-banking/
      - name: Organizers
        menu:
          - name: Conference Organizers
            relative_url: /committee/
          - name: Workshop Organizers
            relative_url: /committee/workshop-organizers/
          - name: Advisory Board
            relative_url: /committee/advisory-board/
      - name: Sponsorship
        relative_url: /sponsorship/
      - name: Accommodation
        relative_url: /accommodation/

  # Link Preview for Sharing
  link_preview:
    # also adapt "preposition" property at top for more meaningful descriptions
    disable: false
    img:
      twitter: 'twitter_preview.png'      # inside /assets/images/
      open_graph: 'facebook_preview.png'  # inside /assets/images/

  # Main landing page
  main:
    # logo:
    #   img: ''
    links:
      - name: Program
        relative_url: /program/
        disabled: true
      - name: How to get there
        relative_url: /location/
        disabled: true
      - name: Tickets
        disabled: true
        absolute_url: ''

  # Information boxes
#  info_bars:
#    - title: The Calls for Workshops is now Live!
#      color: primary
#      main_only: true
#      text: |
#        See [here](workshops/) for details!
 #   - text: This is just some random content for demonstration purposes.
 #     color: warning
 #     pages_only: true

  # Live indications
  live:
    date: 01.01.2020
    timezone: GMT+1
    stop: 240 # in minutes
    streaming:
      enable: true
      pause: 60 # in minutes
      prepend: 5 # in minutes
      extend: 5 # in minutes
    demo:
      enable: false
      duration: 300 # in seconds
      pause: 10 # in seconds

  talks:
    # Talk tracks
    tracks:
      - name: Track A
        color: info
      - name: Track B
        color: success

    # Talk tags
    tags:
      - name: No recording
        icon: video-slash

    # Hide icons on talk overview page
    hide_link_icons: false

  speakers:
    # Show first and last name
    show_firstname: true

  committee:
    show_firstname: true

  location:
    # Disable links to locations
    hide: false
    # URL of location / room overview page
    url: '/location'
    # Main page title shown on location/room navigation bar
    navbar_title: 'Location'
    # Show map on location main page.  Set `map: false` if you don't want to
    # display it.
    map: false
    #map:
    #  # Initial map center point
    #  home_coord: 49.2791, -122.9202
    #  # Alternative map providers can be found on https://leaflet-extras.github.io/leaflet-providers/preview/
    #  # The following do match the Bootstrap design not too badly:
    #  #   - Thunderforest.Neighbourhood
    #  #   - Esri.WorldTopoMap
    #  map_provider: "OpenStreetMap.Mapnik"
    #  default_zoom: 17


  program:
    # URL of program page
    url: '/program'

    # Time steps in program table
    time_steps: 15 # in minutes

    # Show intermediary time steps (next to full hours)
    show_alltimes: true


plugins:
  - jekyll-redirect-from
