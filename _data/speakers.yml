# AI Banking speakers
workshop_ai_banking_speakers:
  - name: Dr. Thibaut Duprey
    affiliation: Senior Director, Financial Stability Department, Bank of Canada
    talk: "Challenges and opportunities of AI for central banking and financial stability"
    abstract: "AI could influence both financial stability and how central banks assess financial system risks. The presentation will first highlight potential financial stability channels of AI adoption. Second, it will describe how new AI and ML research is already reshaping some policy analyses by central banks. Finally, it will discuss future areas where applied AI research can support financial system policymaking."
    url: "https://www.bankofcanada.ca/profile/thibaut-duprey/"
    photo: "https://www.bankofcanada.ca/wp-content/uploads/2018/11/Duprey_Thibaut_7030-250x250.jpg"

